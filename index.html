<style>
/* Layout: sticky club bar, tab nav, one working screen at a time; a match opens a full-screen floodlit stage. Single committed night-match look. */
:root{
  --bg:#0d1419;--panel:#15202a;--panel2:#1b2a36;--line:#2a3c4a;
  --fg:#e8eff3;--muted:#8ea2af;--accent:#ffb020;--accent-ink:#241600;
  --me:#3ec1ff;--foe:#ff5a6a;--good:#4ade80;--bad:#ff6b78;
  --pitch:#1f6b3a;--pitch2:#1a5f33;
  --fd:'Barlow Condensed','Noto Sans JP',sans-serif;
  --fb:'Noto Sans JP',system-ui,-apple-system,'Hiragino Sans',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font:14px/1.6 var(--fb);-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
.wrap{max-width:880px;margin:0 auto;padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:10px}
.brand{font:800 26px/1 var(--fd);letter-spacing:.08em}
.brand span{color:var(--accent);margin-left:6px}
.stat{display:flex;gap:14px;align-items:center;font-size:13px;color:var(--muted);min-width:0}
.stat b{color:var(--fg);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw}
.coin{font:700 18px var(--fd);color:var(--accent);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;color:var(--muted);cursor:pointer;font-weight:700;white-space:nowrap}
.nav button[aria-current="true"]{color:var(--fg);border-color:var(--accent)}
.nav button:hover{color:var(--fg)}
h2{font:700 22px/1.2 var(--fd);letter-spacing:.06em;margin:0 0 10px;text-transform:uppercase}
h3{font-size:13px;color:var(--muted);margin:0 0 8px;font-weight:700;letter-spacing:.04em}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:8px 14px;cursor:pointer;font-weight:700}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible,.nav button:focus-visible,.cb:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:16px;padding:12px 22px}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.on{border-color:var(--accent);color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.vs{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 16px}
.vs .tm{flex:1;min-width:0;font:700 22px/1.2 var(--fd);letter-spacing:.04em}
.vs .tm.r{text-align:right}
.vs i{font:700 14px var(--fd);color:var(--muted);font-style:normal}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:baseline}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:700}
th:nth-child(2),td:nth-child(2){text-align:left;white-space:normal}
th:first-child,td:first-child{text-align:center;width:34px}
tr.me td{background:rgba(62,193,255,.1);font-weight:700}
.scroll{overflow-x:auto}
.bar{height:5px;background:var(--line);border-radius:3px;min-width:46px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.pl{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(5,minmax(52px,1fr));gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.pl .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.tag{display:inline-block;font:700 11px var(--fd);letter-spacing:.06em;padding:1px 6px;border-radius:3px;margin-right:6px;background:var(--line);color:var(--fg)}
.tag.GK{background:#f5d142;color:#241600}.tag.DF{background:#3b82f6}.tag.MF{background:#10b981;color:#06231a}.tag.FW{background:var(--foe);color:#2a0509}
.st{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted)}
.st .v{display:flex;justify-content:space-between;gap:6px;align-items:center}
.st .v b{color:var(--fg);font-size:13px}
.plus{background:none;border:1px solid var(--line);color:var(--accent);border-radius:3px;font-size:11px;padding:0 6px;cursor:pointer;line-height:18px}
.plus:hover{border-color:var(--accent)}.plus[disabled]{opacity:.3;cursor:not-allowed}
.ovr{font:800 24px var(--fd);text-align:center}
select{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:6px 8px;width:100%;min-width:0}
input[type=text]{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:8px 10px;width:100%}
.hist{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.wdl{font:800 14px var(--fd);width:22px;height:22px;display:grid;place-items:center;border-radius:3px;color:#06150b}
.wdl.W{background:var(--good)}.wdl.D{background:#cbd5e1}.wdl.L{background:var(--bad)}
.big{font:800 54px/1 var(--fd);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.cup{border:1px solid var(--accent);background:rgba(255,176,32,.08);border-radius:6px;padding:14px 16px;margin-bottom:16px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--accent);border-radius:4px;padding:8px 16px;z-index:60;font-weight:700;max-width:90vw}
/* match stage */
.ml{position:fixed;inset:0;background:#070c10;z-index:40;display:flex;flex-direction:column;gap:6px;padding-top:max(8px,env(safe-area-inset-top,0px));padding-bottom:max(8px,env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.mhud{display:flex;align-items:center;justify-content:center;gap:12px;position:relative;min-height:40px}
.sb{display:flex;align-items:center;gap:12px;font:800 30px/1 var(--fd);letter-spacing:.04em;min-width:0}
.tn{font-size:17px;max-width:30vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tn.me{color:var(--me)}.tn.foe{color:var(--foe)}
.clock{font:700 20px var(--fd);color:var(--accent);min-width:46px;text-align:center;font-variant-numeric:tabular-nums}
#pauseBtn{position:absolute;right:0;top:50%;transform:translateY(-50%);min-width:44px;min-height:36px}
.stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#cv{width:100%;height:100%;object-fit:contain;touch-action:none;display:block}
.banner{position:absolute;left:0;right:0;top:42%;transform:translateY(-50%);text-align:center;font:800 clamp(34px,8vw,76px)/1 var(--fd);letter-spacing:.1em;color:var(--accent);text-shadow:0 4px 24px rgba(0,0,0,.85);pointer-events:none;z-index:4}
.pov{position:absolute;inset:0;background:rgba(7,12,16,.88);display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto;z-index:6}
.pov .panel{width:min(100%,460px);max-height:100%;overflow:auto}
.zone{position:absolute;left:0;top:0;bottom:0;width:48%;touch-action:none;z-index:2;display:none}
.stick{position:absolute;left:18px;bottom:18px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.3);z-index:3;display:none;opacity:.75;pointer-events:none}
.stick i{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:var(--accent);opacity:.9}
.btns{position:absolute;right:18px;bottom:18px;width:250px;height:212px;z-index:3;display:none}
.cb{position:absolute;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.35);border-radius:50%;font:700 13px var(--fd);letter-spacing:.08em;touch-action:none;cursor:pointer;color:var(--fg);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.cb.big{right:0;bottom:0;width:112px;height:112px;font-size:17px}
.cb.pa{right:130px;bottom:6px;width:84px;height:84px;font-size:15px}
.cb.da{right:14px;bottom:126px;width:90px;height:90px;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:14px}
.cb.sw{right:116px;bottom:118px;width:64px;height:64px;font-size:11px}
.cb.act{filter:brightness(1.5);transform:scale(.94)}
.hint{display:none;text-align:center;color:var(--muted);font-size:12px}
@media (pointer:coarse){.zone,.stick,.btns,.chg{display:block}}
@media (hover:hover) and (pointer:fine){.hint{display:block}}
@media (pointer:coarse){
  .btn{min-height:44px;padding:10px 16px}.btn.sm{min-height:40px;padding:8px 14px}
  .nav button{padding:14px 18px;font-size:15px}
  .plus{padding:5px 10px;line-height:24px;font-size:13px}
  select,input[type=text]{min-height:44px;font-size:16px}
}
@media (min-width:900px){.wrap{max-width:1040px}}
@media (max-width:420px){.pl{grid-template-columns:minmax(0,1fr) repeat(5,minmax(40px,1fr));gap:4px}.big{font-size:44px}}
@media (max-height:520px){.btns{transform:scale(.8);transform-origin:right bottom}.stick{width:120px;height:120px}}
/* gacha */
.rar{display:inline-block;font:800 12px var(--fd);letter-spacing:.08em;padding:1px 7px;border-radius:3px;margin-right:6px;color:#0b1116}
.rar.N{background:#cbd5e1}.rar.R{background:#60a5fa}.rar.SR{background:#c084fc}.rar.UR{background:linear-gradient(90deg,#ffd45a,#ff9d2e,#ffd45a);color:#2a1700}
.gbanner{border-radius:6px;padding:20px;background:radial-gradient(120% 140% at 80% 0%,rgba(255,176,32,.28),transparent 60%),linear-gradient(135deg,#1b2a36,#101a22);border:1px solid var(--line)}
.rates{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.rates span{font:700 13px var(--fd);letter-spacing:.04em;display:flex;align-items:center}
.pity{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 4px}
.pity i{display:block;height:100%;background:linear-gradient(90deg,#c084fc,#ffb020)}
.gx{position:fixed;inset:0;z-index:80;background:radial-gradient(90% 90% at 50% 40%,#16212c,#05080b);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto;touch-action:manipulation}
#gfx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.gbody{position:relative;z-index:1;width:100%;max-width:900px;display:flex;flex-direction:column;align-items:center;gap:18px}
.orb{width:min(46vw,200px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--oc,#cbd5e1) 45%,#0b1116 100%);box-shadow:0 0 60px 10px var(--oc,#cbd5e1);animation:orbp .5s ease-in-out infinite alternate}
.orb.shake{animation:orbs .09s linear infinite}
@keyframes orbp{from{transform:scale(.94)}to{transform:scale(1.06)}}
@keyframes orbs{0%{transform:translate(-4px,2px) scale(1.1)}50%{transform:translate(4px,-3px) scale(1.14)}100%{transform:translate(-3px,-2px) scale(1.1)}}
.gtext{font:800 20px var(--fd);letter-spacing:.2em;color:var(--muted);text-align:center}
.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;width:100%}
.cards.one{grid-template-columns:minmax(0,230px);justify-content:center}
@media (max-width:640px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{perspective:700px;aspect-ratio:3/4.1;position:relative}
.card .in{position:absolute;inset:0;transition:transform .55s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.card.up .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;border-radius:8px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;text-align:center;overflow:hidden}
.card .b{background:linear-gradient(145deg,#243545,#121c25);border:2px solid var(--line);font:800 26px var(--fd);color:var(--line)}
.card .f{transform:rotateY(180deg);background:linear-gradient(160deg,var(--c1),#0f1820 80%);border:3px solid var(--c0);gap:3px;box-shadow:0 0 22px -2px var(--c0)}
.card .f .o{font:800 44px/1 var(--fd)}
.card .f .n{font-weight:700;font-size:13px;line-height:1.3}
.card .f small{color:var(--muted);font-size:11px}
.card.UR .f{background:linear-gradient(160deg,#6b4300,#1a0f00 80%)}
.card.up.UR .f{animation:urp 1.4s ease-in-out infinite alternate}
@keyframes urp{from{box-shadow:0 0 26px 2px rgba(255,176,32,.55)}to{box-shadow:0 0 52px 12px rgba(255,200,80,.95)}}
.newtag{font:800 11px var(--fd);background:var(--good);color:#06150b;padding:0 6px;border-radius:3px;letter-spacing:.08em}
.flash{position:absolute;inset:0;z-index:3;pointer-events:none;background:#fff;opacity:0}
.flash.go{animation:fl .6s ease-out}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.orb,.orb.shake,.card.up.UR .f{animation:none}.card .in{transition:none}.flash.go{animation:none}}

.load{position:fixed;inset:0;z-index:100;background:radial-gradient(90% 80% at 50% 30%,#16212c,#05080b);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .5s;padding:24px}
.load.out{opacity:0;pointer-events:none}
.load .lg{font:800 clamp(40px,10vw,84px)/1 var(--fd);letter-spacing:.14em;text-align:center}
.load .lg span{color:var(--accent)}
.load .lb{width:min(70vw,320px);height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.load .lb i{display:block;height:100%;width:0;background:var(--accent)}
.load .nt{position:absolute;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom,0px));text-align:center;font-size:10px;line-height:1.5;color:var(--muted);padding:0 24px}
.pe{display:flex;gap:6px;align-items:center;margin-top:3px}
.pe input{padding:4px 8px;min-height:0;font-size:13px}

.rays{position:fixed;inset:0;overflow:hidden;pointer-events:none;opacity:0;transition:opacity .6s;z-index:0}
.gx.ur .rays,.gx.sr .rays{opacity:1}
.rays i{position:absolute;left:50%;top:42%;width:240vmax;height:240vmax;margin:-120vmax 0 0 -120vmax;background:repeating-conic-gradient(rgba(255,176,32,.26) 0 6deg,transparent 6deg 18deg);animation:rot 16s linear infinite}
.gx.sr .rays i{background:repeating-conic-gradient(rgba(192,132,252,.22) 0 6deg,transparent 6deg 18deg)}

@media (prefers-reduced-motion:reduce){.rays i{animation:none}}
.slots{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:10px 0 12px}
.slot{border:1px solid var(--line);border-radius:4px;padding:6px 2px;text-align:center;font:700 12px var(--fd);letter-spacing:.04em;color:var(--muted);background:var(--panel2)}
.slot.on{border-color:var(--accent);color:var(--accent)}.slot.now{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mi{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.mi .tx{flex:1;min-width:0}
.mi .pg{height:4px;background:var(--line);border-radius:2px;margin-top:4px;overflow:hidden}.mi .pg i{display:block;height:100%;background:var(--good)}
.pick{display:flex;gap:14px;align-items:center;margin-top:14px;padding:12px;border:1px solid var(--accent);border-radius:6px;background:rgba(255,176,32,.07)}
.pick .o{font:800 44px/1 var(--fd);color:var(--accent)}
.sk{display:inline-block;font:700 11px var(--fd);letter-spacing:.04em;padding:1px 6px;border:1px solid var(--accent);color:var(--accent);border-radius:3px}
.rd{display:flex;gap:8px;margin:10px 0 14px}
.rd span{flex:1;text-align:center;padding:6px 2px;border:1px solid var(--line);border-radius:4px;font:700 13px var(--fd);letter-spacing:.04em;color:var(--muted)}
.rd span.cur{border-color:var(--accent);color:var(--accent)}.rd span.ok{background:var(--good);color:#06150b;border-color:var(--good)}
.who{position:absolute;left:0;top:50%;transform:translateY(-50%);font:700 14px var(--fd);color:var(--me);letter-spacing:.04em;max-width:24vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.who i{display:inline-block;height:5px;background:var(--accent);vertical-align:middle;margin-left:6px;border-radius:2px}

.orbwrap{position:relative;display:grid;place-items:center;width:min(62vw,270px);aspect-ratio:1;--oc:#cbd5e1}

.orbwrap .ring.r2{animation-delay:.65s}

.orb.shake2{animation:orbs .05s linear infinite}

.splash.UR{color:#ffc542}.splash.SR{color:#c9a0ff}
@keyframes spl{from{transform:scale(2.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes gshake{0%,100%{transform:translate(0)}20%{transform:translate(-10px,6px)}40%{transform:translate(9px,-7px)}60%{transform:translate(-7px,-5px)}80%{transform:translate(6px,7px)}}

@media (prefers-reduced-motion:reduce){.orb.shake2,.orbwrap .ring,.card.SR .f::after,.card.UR .f::after,.splash,.gsum,.gx.shk .gbody{animation:none}.splash,.gsum{opacity:1}}

.kwrap{position:relative;width:min(96vw,calc(52vh*1.7778),900px);aspect-ratio:16/9;border-radius:8px;overflow:hidden;border:1px solid var(--line);box-shadow:0 0 50px -8px var(--oc,#cbd5e1);--oc:#cbd5e1;transition:box-shadow .3s}

.cb.fe{right:196px;bottom:100px;width:60px;height:60px;font-size:10px}

function mkPlayer(pos,b){

  const gk=[...s.squad].sort((a,b)=>b.gk-a.gk)[0];

  for(const sl of FORMS[s.form]){

function schedule(n){
  const t=[...Array(n).keys()],rounds=[];
  for(let r=0;r<n-1;r++){
    const rd=[];
    for(let i=0;i<n/2;i++){const a=t[i],b=t[n-1-i];rd.push(r%2?[b,a]:[a,b])}
    rounds.push(rd);t.splice(1,0,t.pop());
  }
  return rounds.concat(rounds.map(rd=>rd.map(([a,b])=>[b,a])));
}

function genPlayer(rar){

  if(rar==='UR')for(const k of ['spd','sht','pas','def','gk'])p[k]=Math.min(95,p[k]+3);
  p.rar=rar;if(rar==='SR'||rar==='UR')p.sk=pick(SKP[p.pos]);return p;
}
const rollRar=()=>{const r=Math.random()*100;return r<3?'UR':r<17?'SR':r<50?'R':'N'};
function doPull(n,mode){
  if(mode==='free'){if(S.lastFree===today())return null;S.lastFree=today()}
  else if(mode==='ticket'){if(S.tickets<n)return null;S.tickets-=n}
  else{const cost=n===10?PRICE10:PRICE1;if(S.coins<cost)return null;S.coins-=cost}
  mission('pull',n);
  const out=[];let hasSR=false;
  for(let i=0;i<n;i++){
    S.pity++;
    let r=S.pity>=40?'UR':rollRar();
    if(n===10&&i===9&&!hasSR&&RO.indexOf(r)<2)r='SR';
    if(r==='UR')S.pity=0;
    if(RO.indexOf(r)>=2)hasSR=true;
    const p=(r==='UR'&&Math.random()<.55)?fromPick(pickup()):genPlayer(r);let sold=0;
    if(S.squad.length>=SQMAX){sold=RAR[r].sell;S.coins+=sold}else S.squad.push(p);
    out.push({p,sold});
  }
  save();return out;
}

function kick(p,ang,sp,isPass){
  const b=M.ball;b.owner=null;b.tgt=null;b.fire=false;b.one=false;b.air=0;const bs=S.opt.bspd||1;sp*=bs;b.vx=Math.cos(ang)*sp;b.vy=Math.sin(ang)*sp;if(!isPass)M.offs=null;M.noOff=false;
  b.x=p.x+Math.cos(ang)*16;b.y=p.y+Math.sin(ang)*16;b.last=p;p.cool=.35;p.hold=0;p.kt=.3;sfx('kick');
}
const VX=680,VY=410,VYU=770;
/* 画面内の味方だけを狙う。緑の輪が出ている味方に必ず届く */
function passTarget(p,aim){
  let best=null,bs=-1e9;const cm=M.cam,usr=p===M.ctrl;
  for(const q of M.players){
    if(q.t!==p.t||q===p||q.gk||q.out)continue;
    const dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy);
    if(d<40||d>1000)continue;
    const zm=S.opt.zoom||1;if(usr&&(Math.abs(q.x-cm.x)>VX*zm||q.y-cm.y>VY*zm||cm.y-q.y>VYU*zm))continue;
    let s;
    if(aim!=null){const da=Math.abs(angDiff(Math.atan2(dy,dx),aim));if(da>.95)continue;s=-da*420-d*.08}
    else s=(q.x-p.x)*dirOf(p.t)*.35-d*.2;
    let near=1e9;
    for(const o of M.players)if(o.t!==p.t&&!o.out)near=Math.min(near,distSeg(o,p,q));
    s+=Math.min(near,70)*2.2-(near<24?260:0);
    if(s>bs){bs=s;best=q}
  }
  return best;
}
/* 受け手の未来位置と空気抵抗から逆算して、受け手の足元でちょうど止まる速さで蹴る */
function doPass(p,q,thru,lob){
  const K=.85,VF=thru?300:240,sk=p.d.sk==='passer';let t=0,tx=q.x,ty=q.y,d=0;
  for(let i=0;i<4;i++){tx=clamp(q.x+q.vx*t*.85+(thru?dirOf(p.t)*170:0),30,W-30);ty=clamp(q.y+q.vy*t*.85,30,H-30);d=Math.hypot(tx-p.x,ty-p.y);t=Math.log((VF+K*d)/VF)/K}
  const ang=Math.atan2(ty-p.y,tx-p.x)+rr(-1,1)*(100-p.d.pas)/100*(sk?.012:.035);
  if(S.opt.offside&&!M.noOff&&isOffside(q,p)){M.offs=[q];M.offT=p.t;M.offsT=2.6}else M.offs=null;
  const bs=S.opt.bspd||1;
  kick(p,ang,clamp((VF+K*d)/bs,330,1100)*(sk?1.06:1),true);
  M.ball.tgt=q;M.ball.tgtT=3.2;M.ball.lp=p;M.ball.lpT=M.t;
  if(lob){M.ball.airT=M.ball.air=clamp(t*.9,.5,1.4);M.ball.airH=55+d*.07}
  if(p.t===HS&&!p.gk)M.ctrl=q;
}
function doShot(p,pw,aimY,fire){
  const gx=p.t?0:W,ty=H/2+(aimY!=null?aimY:rr(-56,56)*(GW/150));
  const base=Math.atan2(ty-p.y,gx-p.x);
  const dg=Math.hypot(gx-p.x,H/2-p.y);
  let nr=1e9;for(const o of M.players)if(o.t!==p.t&&!o.gk&&!o.out)nr=Math.min(nr,Math.hypot(o.x-p.x,o.y-p.y));
  const one=nr>150&&dg<760;
  if(p.t===0&&p===M.ctrl&&dg<560)M.slow=.7;
  const err=fire?0:(p.d.sk==='cannon'?.7:1)*((100-p.d.sht)/100*.42+(pw>.95?.07:0)+Math.abs(pw-.85)*.12)*(.6+dg/540)*(one?.55:1)*rr(-1,1);
  kick(p,base+err,(700+p.d.sht*3)*(.8+.2*pw)*(p.d.sk==='cannon'?1.12:1)*(fire?1.4:1));
  M.ball.fire=!!fire;M.ball.one=one;M.shots[p.t]++;p.sh=(p.sh||0)+1;
}
function feint(c){
  const m=M;c.fcool=.9;c.feint=.5;c.fs=-(c.fs||1);
  c.vx+=-c.fy*c.fs*380;c.vy+=c.fx*c.fs*380;
  for(const d of m.players)if(d.t!==c.t&&!d.gk&&!d.out&&Math.hypot(d.x-c.x,d.y-c.y)<110)d.stun=.6;
  sfx('tick',3);
}
function steerTo(p,tx,ty,dt,mul){
  const dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy);
  let vx=0,vy=0;
  if(d>4){const sp=Math.min(spdOf(p)*(mul||1),d*6);vx=dx/d*sp;vy=dy/d*sp}
  const k=Math.min(1,dt*8);p.vx+=(vx-p.vx)*k;p.vy+=(vy-p.vy)*k;
}
function nearestOpp(p){
  let bo=null,bd=1e9;
  for(const o of M.players)if(o.t!==p.t){const d=Math.hypot(o.x-p.x,o.y-p.y);if(d<bd){bd=d;bo=o}}
  return {o:bo,d:bd};
}
/* --- AI --- */
function aiOwner(p,dt){
  p.think-=dt;
  if(p.pen>0){p.pen-=dt;steerTo(p,p.x,p.y,dt,0);if(p.pen<=0){p.pen=0;doShot(p,.9,rr(-GW*.4,GW*.4))}return}
  if(p.gk){
    p.hold+=dt;steerTo(p,p.x,p.y,dt);
    if(p.hold>.9){const q=passTarget(p,null);if(q)doPass(p,q);else kick(p,p.t?Math.PI:0,300)}
    return;
  }
  const gx=p.t?0:W,d=Math.hypot(gx-p.x,H/2-p.y),nr=nearestOpp(p);
  if(p.think<=0){
    p.think=rr(.18,.4);
    if(d<(p.t?470:355)&&Math.abs(p.y-H/2)<(p.t?300:270)&&Math.random()<(p.t?.55:.4)+(d<240?.3:0)){doShot(p,.8+Math.random()*.2,null);return}
    if((nr.d<48&&Math.random()<.6)||Math.random()<.08){const q=passTarget(p,null);if(q){doPass(p,q);return}}
  }
  let tx=gx,ty=H/2;
  if(nr.d<90){ty=p.y+Math.sign(p.y-nr.o.y||1)*80;tx=p.x+dirOf(p.t)*60}
  steerTo(p,tx,ty,dt,1.05*am(p));
}
const am=p=>p.t?M.aiMul:1;
function aiOff(p,dt){
  const m=M,b=m.ball,own=b.owner&&b.owner.t===p.t,dir=dirOf(p.t),k=am(p);
  if(b.tgt===p){steerTo(p,b.x+b.vx*.3,b.y+b.vy*.3,dt,1.35*k);return}
  if(m.chaser[p.t]===p){
    const tx=b.owner?b.owner.x:b.x+b.vx*.25,ty=b.owner?b.owner.y:b.y+b.vy*.25;
    steerTo(p,tx,ty,dt,1.1*k);return;
  }
  if(m.chaser2[p.t]===p){
    steerTo(p,clamp(b.x*.7+(p.t?W:0)*.3,40,W-40),b.y,dt,k);return;
  }
  let hx=p.t?W-p.slot.x*W:p.slot.x*W,hy=p.slot.y*H;
  if(own){hx+=dir*W*.05*(p.slot.r==='FW'?1.4:.7)+(b.x-hx)*.4;hy+=(b.y-hy)*.35}
  else{hx+=(b.x-hx)*.45;hy+=(b.y-hy)*.45}
  steerTo(p,clamp(hx,40,W-40),clamp(hy,40,H-40),dt,.85*k);
}
function aiGK(p,dt){
  const b=M.ball,goalX=p.t?W:0,gx=p.t?W-24:24,dist=Math.abs(b.x-goalX);
  const step=dist<360?(360-dist)/360*32:0;
  let ty=clamp(H/2+(b.y-H/2)*.4,GY0+12,GY1-12);
  if(!b.owner&&b.vx*(goalX-b.x)>0&&Math.abs(b.vx)>60){
    const tt=(gx-b.x)/b.vx;if(tt>0)ty=clamp(b.y+b.vy*tt,GY0-18,GY1+18);
  }
  steerTo(p,gx+dirOf(p.t)*step,ty,dt,1.3);
}
function userMove(p,dt){
  const I=(M.pvp&&p.t===1)?RI:inp;
  if(M.ball.tgt===p&&Math.hypot(I.x,I.y)<.2){steerTo(p,M.ball.x+M.ball.vx*.3,M.ball.y+M.ball.vy*.3,dt,1.25);return}
  let mx=I.x,my=I.y;
  if(I.press&&M.ball.owner&&M.ball.owner.t!==p.t){const o=M.ball.owner,dx=o.x-p.x,dy=o.y-p.y,dd=Math.hypot(dx,dy)||1;if(dd>26){mx=mx*.35+dx/dd*.65;my=my*.35+dy/dd*.65}}const l=Math.hypot(mx,my);
  if(l>1){mx/=l;my/=l}
  const sprint=I.sprint&&p.sta>.05&&l>.2;
  p.sta=sprint?Math.max(0,p.sta-.45*dt):Math.min(1,p.sta+.18*dt);
  const sp=spdOf(p)*(sprint?1.28:1)*(M.ball.owner===p?.94:1),k=Math.min(1,dt*9);
  p.vx+=(mx*sp-p.vx)*k;p.vy+=(my*sp-p.vy)*k;
  if(p.feint>0){p.vx+=-p.fy*p.fs*600*dt;p.vy+=p.fx*p.fs*600*dt}
  if(p.lunge>0){p.vx+=p.fx*700*dt;p.vy+=p.fy*700*dt}

function updateChasers(){
  const m=M,b=m.ball;
  for(const t of [0,1]){
    m.chaser[t]=null;m.chaser2[t]=null;
    if(b.owner&&b.owner.t===t)continue;
    const c=m.players.filter(p=>p.t===t&&!p.gk&&p!==m.ctrl&&p!==m.ctrl1&&!p.out).sort((p,q)=>Math.hypot(p.x-b.x,p.y-b.y)-Math.hypot(q.x-b.x,q.y-b.y));
    m.chaser[t]=c[0]||null;
    if(b.owner&&(t?b.x>W*.45:b.x<W*.55))m.chaser2[t]=c[1]||null;
  }
}
function nearestToBall(t,skip){
  let bp=null,bd=1e9;const b=M.ball;
  for(const p of M.players){if(p.t!==t||p.gk||p===skip||p.out)continue;const d=Math.hypot(p.x-b.x,p.y-b.y);if(d<bd){bd=d;bp=p}}
  return bp;
}
/* --- 更新 --- */
function update(dt){
  if(M&&M.slow>0){M.slow-=dt;if(!M.pvp)dt*=.45}
  const m=M,b=m.ball;if(m.pause)return;
  m.anim+=dt;m.flash=Math.max(0,m.flash-dt);
  {const f0=(m.phase==='goal'&&m.celeb)?m.celeb:b.owner,tx0=f0?f0.x+f0.fx*140:b.x+b.vx*.3,ty0=f0?f0.y+f0.fy*50:b.y+b.vy*.2,ck=Math.min(1,dt*(m.phase==='play'?3.5:6));
   m.cam.x+=(clamp(tx0,620,W-620)-m.cam.x)*ck;m.cam.y+=(clamp(ty0,400,H-400)-m.cam.y)*ck}
  if(m.phase==='end')return;
  if(m.phase==='ht')return;
  if(m.phase==='replay'){
    const r=m.rep;r.i+=dt*60*.75;const k=Math.floor(r.i);
    if(k>=r.f.length-1||m.skip){m.skip=false;m.rep=null;$('#rpl').hidden=true;m.phase='goal';m.pt=0;return}
    const a=r.f[k];let q=0;
    for(const p of m.players){p.x=a[q++];p.y=a[q++];p.vx=a[q++];p.vy=a[q++];p.fx=a[q++];p.fy=a[q++];p.kt=a[q++];p.sv=a[q++]}
    m.ball.x=a[q++];m.ball.y=a[q++];m.ball.vx=a[q++];m.ball.vy=a[q++];m.ball.owner=null;m.anim+=dt;return}
  if(m.phase==='intro'){m.pt-=dt;m.ik=Math.max(0,m.pt/2.8);m.ik*=m.ik;if(m.pt<=0||m.skip){m.ik=0;m.skip=false;m.phase='kick';m.pt=1.3;$('#intro').hidden=true;banner('KICK OFF');sfx('whistle')}return}
  if(m.phase==='kick'){m.pt-=dt;if(m.pt<=0){m.phase='play';banner(null)}return}
  if(m.phase==='sp'){m.sp.pt-=dt;if(m.sp.pt<=0)startSp();return}
  if(m.phase==='half'||m.phase==='goal'){
    m.pt-=dt;
    if(m.phase==='goal'&&m.celeb){const c=m.celeb;c.lunge=Math.max(0,c.lunge-dt);
      for(const p of m.players)if(p.t===c.t&&p!==c&&!p.gk&&!p.out){const dx=c.x-p.x,dy=c.y-p.y,d=Math.hypot(dx,dy);if(d>60){p.vx=dx/d*260;p.vy=dy/d*260;p.fx=dx/d;p.fy=dy/d}}}
    for(const p of m.players){p.vx*=.9;p.vy*=.9;p.x+=p.vx*dt;p.y+=p.vy*dt}
    if(b.owner){b.owner=null}
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=Math.pow(.2,dt);b.vy*=Math.pow(.2,dt);
    if(m.pt<=0){
      if(m.phase==='goal'&&m.rep){startReplay();return}
      if(m.t>=m.dur){finish();return}
      resetKick(m.kickNext!=null?m.kickNext:0);m.kickNext=null;
    }
    return;
  }
  m.t+=dt;
  const min=Math.min(90,Math.floor(m.t/m.dur*90));
  if(min!==m.min){m.min=min;$('#sbT').textContent=min+"'"}
  if(!m.halfDone&&m.t>=m.dur/2){m.halfDone=true;m.kickNext=1;if(m.pvp){m.phase='half';m.pt=3;banner('HALF TIME')}else{m.phase='ht';banner(null);showHT()}return}
  if(m.t>=m.dur){m.phase='goal';m.pt=.8;m.kickNext=null;banner('FULL TIME');return}
  recFrame();m.protect=Math.max(0,m.protect-dt);if(m.offs){m.offsT-=dt;if(m.offsT<=0)m.offs=null}
  /* 操作 */
  ctrlSwitch(dt,inp);if(m.pvp)side1(()=>ctrlSwitch(dt,RI));
  updateChasers();
  for(const p of m.players){
    if(p.out)continue;
    p.cool=Math.max(0,p.cool-dt);p.sv=Math.max(0,p.sv-dt);p.kt=Math.max(0,(p.kt||0)-dt);p.feint=Math.max(0,(p.feint||0)-dt);p.fcool=Math.max(0,(p.fcool||0)-dt);p.stun=Math.max(0,(p.stun||0)-dt);p.lunge=Math.max(0,(p.lunge||0)-dt);if(!p.lunge)p.slide=false;p.lc=Math.max(0,(p.lc||0)-dt);
    if(p===m.ctrl||(m.pvp&&p===m.ctrl1))userMove(p,dt);
    else if(b.owner===p)aiOwner(p,dt);
    else if(p.gk)aiGK(p,dt);
    else aiOff(p,dt);
  }
  ctrlBlock(dt,inp);if(m.pvp)side1(()=>ctrlBlock(dt,RI));
  if(b.owner)b.tgt=null;else if(b.tgt){b.tgtT-=dt;if(b.tgtT<=0)b.tgt=null}
  for(const p of m.players){
    if(p.out)continue;
    p.x=clamp(p.x+p.vx*dt,PR,W-PR);p.y=clamp(p.y+p.vy*dt,PR,H-PR);
    const sp=Math.hypot(p.vx,p.vy);
    if(sp>25){p.fx+=(p.vx/sp-p.fx)*Math.min(1,dt*10);p.fy+=(p.vy/sp-p.fy)*Math.min(1,dt*10);const l=Math.hypot(p.fx,p.fy)||1;p.fx/=l;p.fy/=l}
  }
  /* ボール */
  if(b.owner){
    const o=b.owner;
    const nx=o.x+o.fx*13,ny=o.y+o.fy*13;
    if(S.opt.out&&!o.gk&&(nx<0||nx>W||ny<0||ny>H)){b.x=nx;b.y=ny;b.owner=null;b.vx=b.vy=0;b.last=o;outBall(nx<0||nx>W?'goal':'touch');return}
    b.x=clamp(nx,5,W-5);b.y=clamp(ny,5,H-5);b.vx=o.vx;b.vy=o.vy;b.last=o;
    m.poss[o.t]+=dt;
    for(const d of m.players){
      if(d.t===o.t||d.gk||d.out||d.stun>0)continue;
      if(Math.hypot(d.x-b.x,d.y-b.y)<(d.lunge>0?(d.slide?46:38):30)){
        d.tk-=dt;
        if(d.tk<=0){
          d.tk=d.lunge>0?.1:.28;
          if(m.protect>0)continue;
          if(Math.random()<[0,.03,.06,.11][S.opt.foul|0]*(d.lunge>0?(d.slide?3:2.2):1)){callFoul(d,o);return}
          if(Math.random()<clamp(.64+(d.d.def-o.d.spd)/200+(d.t?[.02,.1,.18][m.diff]:0)-(o.d.sk==='dribbler'?.12:0)-(o.feint>0?.5:0)+(d.lunge>0?(d.slide?.4:.3):0)+(m.players.some(z=>z.t===d.t&&z!==d&&!z.gk&&Math.hypot(z.x-b.x,z.y-b.y)<60)?.12:0),.1,.92)){
            b.owner=null;b.vx=d.fx*160+rr(-60,60);b.vy=d.fy*160+rr(-60,60);o.cool=.6;d.tw=(d.tw||0)+1;break;
          }
        }
      }
    }
  }else{
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    const f=Math.pow(Math.exp(-.85),dt);b.vx*=f;b.vy*=f;
    const inGoal=b.y>GY0&&b.y<GY1;
    if(!S.opt.out){
      if(b.y<5){b.y=5;b.vy=Math.abs(b.vy)*.8}
      if(b.y>H-5){b.y=H-5;b.vy=-Math.abs(b.vy)*.8}
      if(b.x<5&&!inGoal){b.x=5;b.vx=Math.abs(b.vx)*.8}
      if(b.x>W-5&&!inGoal){b.x=W-5;b.vx=-Math.abs(b.vx)*.8}
    }else{
      if(b.y<0||b.y>H){outBall('touch');return}
      if(!inGoal&&(b.x<0||b.x>W)){outBall('goal');return}
    }
    if(b.x<0&&inGoal){scored(1);return}
    if(b.x>W&&inGoal){scored(0);return}
    const sp=Math.hypot(b.vx,b.vy);
    /* キーパー */
    for(const g of m.players){
      if(!g.gk||g.sv>0||g.cool>0)continue;
      if(Math.hypot(g.x-b.x,g.y-b.y)<30){
        const nf=g.t?1:.5,p=clamp(.52+(g.d.sk==='wall'?.05:0)+g.d.gk/230-(sp-450)/2600+(g.t?[.03,0,-.04][m.diff]:0)-(b.one?.26*nf:0),.22,.9)*(b.fire?.15:1);
        if(Math.random()<p){g.sav=(g.sav||0)+1;
          if(sp<380||Math.random()<.4){b.owner=g;g.hold=0;m.flash=.15;m.offs=null}
          else{b.vx=dirOf(g.t)*rr(150,320);b.vy=rr(-240,240);g.sv=.5;g.cool=.3}
        }else g.sv=.6;
        break;
      }
    }
    /* 拾う */
    if(b.air>0)b.air=Math.max(0,b.air-dt);
    const tq=b.tgt;
    if(tq&&!tq.out&&tq.cool<=0&&(b.air||0)<.12&&sp<1300&&Math.hypot(tq.x-b.x,tq.y-b.y)<32){
      if(m.offs&&m.offs.includes(tq)&&tq.t===m.offT&&S.opt.offside){callOffside(tq);return}
      m.offs=null;b.owner=tq;tq.hold=0;b.tgt=null;if(b.lp&&b.lp.t===tq.t)b.lp.pc=(b.lp.pc||0)+1;
    }
    if(!b.owner&&sp<420){
      let best=null,bd=1e9;
      for(const p of m.players){
        if(p.cool>0||p.out||(b.air||0)>.15)continue;
        const d=Math.hypot(p.x-b.x,p.y-b.y);
        if(d<(p.gk?22:15)&&d<bd){bd=d;best=p}
      }
      if(best){
        if(m.offs&&m.offs.includes(best)&&best.t===m.offT&&S.opt.offside){callOffside(best);return}
        m.offs=null;b.owner=best;best.hold=0
      }
    }
  }
}

/* ===== サッカーのルール ===== */
function isOffside(q,p){
  const t=q.t,dir=dirOf(t);
  const ds=M.players.filter(o=>o.t!==t&&!o.out).map(o=>o.x*dir).sort((a,b)=>b-a);
  const L=ds.length>1?ds[1]:ds[0];
  const qx=q.x*dir;
  return qx>L+6&&qx>p.x*dir+6&&qx>dir*W/2;
}
function setPiece(kind,t,spot,label){
  const m=M,b=m.ball;
  b.owner=null;b.vx=b.vy=0;b.x=spot.x;b.y=spot.y;m.charge=0;
  m.sp={kind,t,spot,pt:kind==='pen'?1.8:1.3};m.phase='sp';m.offs=null;
  banner(label);
}
function outBall(kind){
  const m=M,b=m.ball,l=b.last,lt=l?l.t:0;
  if(kind==='touch'){
    setPiece('throw',1-lt,{x:clamp(b.x,30,W-30),y:b.y<H/2?4:H-4},'THROW-IN');
  }else{
    const gs=b.x<0?0:1;
    if(lt===gs)setPiece('corner',1-gs,{x:gs?W-6:6,y:b.y<H/2?6:H-6},'CORNER KICK');
    else setPiece('gk',gs,{x:gs?W-90:90,y:H/2+rr(-70,70)},'GOAL KICK');
  }
}
function callOffside(p){
  sfx('whistle');
  M.events.push({min:M.min,t:p.t,name:p.name+' (OFFSIDE)',off:true});
  setPiece('fk',1-p.t,{x:clamp(p.x,30,W-30),y:clamp(p.y,25,H-25)},'OFFSIDE');
}
function sendOff(d){
  d.out=true;d.x=-600;d.y=-600;d.vx=d.vy=0;
  if(M.ctrl===d)M.ctrl=null;if(M.ctrl1===d)M.ctrl1=null;
  if(M.ball.owner===d)M.ball.owner=null;
}
function callFoul(d,o){
  const m=M;m.fouls[d.t]++;sfx('whistle');
  const spot={x:clamp(o.x,30,W-30),y:clamp(o.y,25,H-25)};
  const f=S.opt.foul|0;let card=null,label='FOUL';
  const r=Math.random();
  if(r<.015*f){card='red'}
  else if(r<.015*f+.18){d.yc=(d.yc||0)+1;card=d.yc>=2?'red':'yellow'}
  if(card){
    m.cards[d.t]++;
    m.events.push({min:m.min,t:d.t,name:d.name,card});
    label+=card==='yellow'?'  ・  YELLOW CARD':'  ・  RED CARD';
    if(card==='red')sendOff(d);
  }
  const gx=o.t===0?W:0;
  if(Math.abs(spot.x-gx)<495&&Math.abs(spot.y-H/2)<605)setPiece('pen',o.t,{x:o.t===0?W-330:330,y:H/2},label.replace('FOUL','PENALTY'));
  else setPiece('fk',o.t,spot,label);
}
function startSp(){
  const m=M,sp=m.sp,b=m.ball,t=sp.t,k=sp.kind,P=sp.spot;
  const mates=m.players.filter(p=>p.t===t&&!p.out);
  let tk=null;
  if(k==='gk')tk=mates.find(p=>p.gk);
  else if(k==='pen')tk=mates.filter(p=>!p.gk).sort((a,c)=>c.d.sht-a.d.sht)[0];
  else tk=mates.filter(p=>!p.gk).sort((a,c)=>Math.hypot(a.x-P.x,a.y-P.y)-Math.hypot(c.x-P.x,c.y-P.y))[0];
  if(!tk)tk=mates[0];
  const gx=t===0?W:0,R={fk:275,corner:250,throw:55,pen:0,gk:0}[k];
  for(const q of m.players){
    if(q===tk||q.out)continue;
    q.vx=q.vy=0;
    if(k==='pen'){
      if(q.gk){if(q.t!==t){q.x=gx+(t===0?-24:24);q.y=H/2}continue}
      if(Math.abs(q.x-gx)<530)q.x=gx+(t===0?-560:560);
    }else if(R>0&&q.t!==t){
      const dx=q.x-P.x,dy=q.y-P.y,d=Math.hypot(dx,dy);
      if(d<R){const ux=d>1?dx/d:-dirOf(t),uy=d>1?dy/d:0;q.x=clamp(P.x+ux*R,PR,W-PR);q.y=clamp(P.y+uy*R,PR,H-PR)}
    }
  }
  if(k==='pen'){tk.x=P.x-dirOf(t)*20;tk.y=H/2;tk.fx=dirOf(t);tk.fy=0}
  else{tk.x=clamp(P.x,PR,W-PR);tk.y=clamp(P.y,PR,H-PR);const fx=W/2-P.x,fy=H/2-P.y,l=Math.hypot(fx,fy)||1;tk.fx=fx/l;tk.fy=fy/l}
  tk.vx=tk.vy=0;tk.hold=0;tk.cool=0;tk.think=.5;tk.tk=0;
  b.owner=tk;b.last=tk;b.vx=b.vy=0;
  if(!tk.gk){if(t===0)m.ctrl=tk;else m.ctrl1=tk}
  if(k==='pen'&&t===1)tk.pen=.9;
  m.phase='play';m.protect=1.3;m.noOff=true;m.sp=null;banner(null);
}

function calcMom(){

function gfxStart(m){
  g3.ok=false;
  if(typeof THREE==='undefined'||S.opt.cam3d===false)return;
  try{
    m.gkc=[gkColor([m.cols[0],m.cols[1]]),gkColor([m.cols[0],m.cols[1]])];
    if(m.gkc[0]===m.gkc[1])m.gkc[1]=gkColor([m.cols[0],m.cols[1],m.gkc[0]]);
    if(!g3.r){
      g3.r=new THREE.WebGLRenderer({canvas:cv,antialias:true,powerPreference:'high-performance'});
      g3.r.shadowMap.enabled=true;g3.r.shadowMap.type=THREE.PCFSoftShadowMap;
    }
    g3.cam=new THREE.PerspectiveCamera(40,1.7,5,8000);
    buildScene(m);
    g3.cx=0;g3.w=g3.h=0;g3.t0=performance.now();g3.lastGoal=0;g3.shake=0;
    g3.ok=true;
  }catch(e){g3.ok=false;gfxStop()}
}
function gfxStop(){
  if(g3.sc){
    g3.sc.traverse(o=>{
      if(o.geometry)o.geometry.dispose();
      if(o.material){const ms=Array.isArray(o.material)?o.material:[o.material];ms.forEach(mt=>{if(mt.map)mt.map.dispose();mt.dispose()})}
    });
  }
  g3.sc=null;g3.pl=[];g3.ok=false;
}
function draw(){if(g3.ok)draw3d();else draw2d()}
function setLine(o,x,y,ang,len,w,col,op){o.gp.visible=true;o.gp.position.set(x-W/2,0,y-H/2);o.gp.rotation.y=-ang;o.ms.position.x=len/2;o.ms.scale.set(len,w,1);o.ms.material.color.set(col);o.ms.material.opacity=op}
function aimInfo(c,m){const gx=c.t?0:W,ay=H/2+inp.y*GW*.42,ang=Math.atan2(ay-c.y,gx-c.x);return {ang,len:clamp(Math.hypot(gx-c.x,ay-c.y),120,900),w:((100-c.d.sht)*.18+6)*(1+m.charge),col:m.charge>.95?'#ff5a6a':m.charge>0?'#ffb020':'#ffffff',op:m.charge>0?.75:.35,show:m.charge>0||Math.hypot(gx-c.x,H/2-c.y)<800}}
function draw3d(){
  const m=M;if(!m||!g3.sc)return;
  const now=performance.now(),dt=Math.min(.05,(now-g3.t0)/1000);g3.t0=now;
  const w=cv.clientWidth,h=cv.clientHeight;
  if(w&&h&&(w!==g3.w||h!==g3.h)){
    g3.w=w;g3.h=h;g3.r.setPixelRatio(Math.min(1.5,window.devicePixelRatio||1));g3.r.setSize(w,h,false);
    const asp=w/h;g3.cam.aspect=asp;
    g3.cam.fov=asp>=1.7?40:Math.min(78,2*Math.atan(Math.tan(20*Math.PI/180)*1.7/asp)*180/Math.PI);
    g3.cam.updateProjectionMatrix();
  }
  const b=m.ball;
  /* 選手 */
  m.players.forEach((p,i)=>{
    const o=g3.pl[i];if(!o)return;
    o.root.visible=!p.out;if(p.out)return;
    o.root.position.set(p.x-W/2,0,p.y-H/2);
    const tgt=Math.atan2(p.fx,p.fy);let d=tgt-o.ry;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;
    o.ry+=d*Math.min(1,dt*13);o.root.rotation.y=o.ry;
    const sp=Math.hypot(p.vx,p.vy);
    o.ph+=sp*dt*.05;
    const amp=Math.min(1,sp/150)*.95,sw=Math.sin(o.ph)*amp;
    o.legs[0].rotation.x=sw;o.legs[1].rotation.x=-sw;
    o.arms[0].rotation.x=-sw*.9;o.arms[1].rotation.x=sw*.9;
    const kt=p.kt||0;
    if(kt>0){const k=kt/.3;o.legs[1].rotation.x=-1.35*Math.sin(k*Math.PI);o.arms[0].rotation.x=.7*k}
    let lean=Math.min(.2,sp/800);
    o.body.rotation.z=0;o.body.position.y=Math.abs(Math.sin(o.ph))*amp*.9;
    if(p.gk){
      o.arms[0].rotation.x=-.5;o.arms[1].rotation.x=-.5;
      if(p.sv>0){o.dv+=((b.y-p.y>0?1:-1)*(p.t?-1:1)*1.15-o.dv)*Math.min(1,dt*14);o.arms[0].rotation.x=o.arms[1].rotation.x=-2.8}
      else o.dv*=.85;
      o.body.rotation.z=o.dv;lean=.1;
    }
    o.body.rotation.x=lean+(p.lunge>0&&!p.gk?.7:0);
    if(p.feint>0&&!p.gk)o.body.rotation.z=Math.sin(p.feint*22)*.4*(p.fs||1);
    o.head.rotation.y=clamp(Math.atan2(b.x-p.x,b.y-p.y)-o.ry,-.9,.9)*.5;
  });
  /* ボール */
  const bx=b.x-W/2,bz=b.y-H/2,spd=Math.hypot(b.vx,b.vy);
  const ox=g3.ball.position.x,oz=g3.ball.position.z;
  const lift=(!b.owner&&spd>340?Math.min(14,(spd-340)/16):0)+(b.air>0&&b.airT?Math.sin(Math.PI*(1-b.air/b.airT))*b.airH:0);
  g3.ball.position.set(bx,5+lift,bz);
  const mvx=bx-ox,mvz=bz-oz,ml=Math.hypot(mvx,mvz);
  if(ml>.01){g3.ball.rotateOnWorldAxis(new THREE.Vector3(mvz/ml,0,-mvx/ml),ml/5)}
  /* 操作選手の印 */
  const c=m.ctrl;
  if(c&&m.phase!=='end'&&m.phase!=='replay'){
    g3.ring.visible=g3.arrow.visible=true;
    g3.ring.position.set(c.x-W/2,.4,c.y-H/2);g3.ring.scale.setScalar(1+m.charge*.5);
    g3.ring.material.color.set(m.charge>.95?'#ff5a6a':'#ffb020');
    g3.arrow.position.set(c.x-W/2,66+Math.sin(m.anim*7)*2,c.y-H/2);
  }else g3.ring.visible=g3.arrow.visible=false;
  g3.pring.visible=g3.parrow.visible=!!m.ptgt;
  if(m.ptgt){g3.pring.position.set(m.ptgt.x-W/2,.5,m.ptgt.y-H/2);g3.parrow.position.set(m.ptgt.x-W/2,60+Math.sin(m.anim*9)*2,m.ptgt.y-H/2)}
  g3.aim.gp.visible=g3.pl2.gp.visible=false;
  {const cc=m.ctrl;if(cc&&b.owner===cc&&m.phase==='play'){
    const a=aimInfo(cc,m);if(a.show)setLine(g3.aim,cc.x,cc.y,a.ang,a.len,a.w,a.col,a.op);
    if(m.ptgt)setLine(g3.pl2,cc.x,cc.y,Math.atan2(m.ptgt.y-cc.y,m.ptgt.x-cc.x),Math.hypot(m.ptgt.x-cc.x,m.ptgt.y-cc.y),4,'#4ade80',.55)}}
  /* カメラ */
  const cx0=m.cam.x-W/2,cz0=m.cam.y-H/2;
  if(m.flash>.5&&g3.lastGoal<m.anim-1){g3.shake=.9;g3.lastGoal=m.anim}
  if(m.shake){g3.shake=Math.max(g3.shake,.7);m.shake=0}
  g3.shake=Math.max(0,g3.shake-dt*2.2);
  const sk=g3.shake*(Math.random()-.5)*6;
  const ik=m.ik||0,zk=(m.phase==='replay'?.78:1)*(S.opt.zoom||1);g3.cam.position.set(cx0+sk+ik*500,(620+ik*900)*zk,cz0+(900+ik*700)*zk+sk*.5);
  g3.cam.lookAt(cx0,0,cz0+10);
  g3.sun.position.set(cx0-260,700,cz0+400);g3.sun.target.position.set(cx0,0,cz0);g3.sun.target.updateMatrixWorld();
  g3.r.render(g3.sc,g3.cam);
}

function finishCup(r,res){
  let win=res.gf>res.ga,extra='';
  if(res.gf===res.ga){win=Math.random()<.5;extra='<p style="font-weight:700">引き分け。PK戦の結果、'+(win?'勝ち抜きました':'敗退しました')+'。</p>'}
  updateStats({gf:res.gf,ga:res.ga},false);
  S.history.unshift({opp:CLUBS[r.opp-1].n+'(カップ)',gf:res.gf,ga:res.ga,season:S.season});S.history=S.history.slice(0,40);
  mission('play');if(win)mission('win');mission('goal',res.gf);
  let coins=(win?r.coins:40);
  if(win){
    S.tickets+=r.tk;
    if(S.cup.round>=2){S.trophies++;S.cup={round:0,alive:false};extra+='<p style="color:var(--accent);font:800 22px var(--fd);letter-spacing:.1em">CUP WINNER!</p>'}
    else S.cup.round++;
    if(r.tk)extra+='<p class="coin">+ガチャチケット '+r.tk+' 枚</p>';
  }else{S.cup={round:0,alive:false};extra+='<p class="muted">カップ戦から敗退しました。</p>'}
  S.coins+=coins;save();showResult(res,coins,extra);
}

function play(){
  const f=nextFix();if(!f)return;
  if(S.lineup.length!==11||S.lineup.some(id=>!S.squad.find(p=>p.id===id)))autoLineup(S);
  const ut={name:S.club,color:S.color,form:S.form,players:S.lineup.map(id=>S.squad.find(p=>p.id===id))};
  startMatch(ut,oppTeam(f.opp,S.diff),res=>finishMatch(f,res),S.diff);
}
function updateStats(res,online){
  const t=S.stats,o=online?t.om:t;
  const win=res.gf>res.ga,draw=res.gf===res.ga;
  if(online){o.w+=win?1:0;o.d+=draw?1:0;o.l+=(!win&&!draw)?1:0;o.gf+=res.gf;o.ga+=res.ga}
  t.w+=(!online&&win)?1:0;t.d+=(!online&&draw)?1:0;t.l+=(!online&&!win&&!draw)?1:0;
  if(!online){t.gf+=res.gf;t.ga+=res.ga}
  t.cur=win?t.cur+1:0;t.best=Math.max(t.best,t.cur);
}
function showResult(res,coins,extra){
  const win=res.gf>res.ga,draw=res.gf===res.ga;
  const ev=res.events.map(e=>'<div class="hist" style="padding:4px 0"><span class="muted" style="width:34px">'+e.min+"'</span><span style=\"flex:1;color:"+(e.t?'var(--foe)':'var(--me)')+'">'+esc(e.name)+(e.card?(e.card==='yellow'?' [警告]':' [退場]'):'')+'</span></div>').join('')||'<p class="muted">ゴールなし</p>';
  const pv=$('#pov');
  pv.innerHTML='<div class="panel"><div class="rtt '+(win?'W':draw?'D':'L')+'">'+(win?'VICTORY':draw?'DRAW':'DEFEAT')+'</div><div class="big" style="text-align:center">'+res.gf+' - '+res.ga+'</div><div class="muted" style="text-align:center;margin-bottom:10px">'+esc(res.names[0])+' vs '+esc(res.names[1])+'</div>'
   +'<div class="hist" style="justify-content:space-between"><span>シュート</span><b>'+res.shots[0]+' - '+res.shots[1]+'</b></div><div class="hist" style="justify-content:space-between"><span>ボール支配率</span><b>'+res.poss[0]+'% - '+res.poss[1]+'%</b></div>'+(res.fouls?'<div class="hist" style="justify-content:space-between"><span>ファウル / カード</span><b>'+res.fouls[0]+' / '+res.cards[0]+' - '+res.fouls[1]+' / '+res.cards[1]+'</b></div>':'')
   +momHtml(res)+'<h3 style="margin-top:12px">得点経過</h3>'+ev+'<p class="coin" style="margin:12px 0">+'+coins+' コイン</p>'+extra+'<button class="btn pri" data-act="done">続ける</button></div>';
  pv.hidden=false;
}
function finishMatch(f,res){
  const win=res.gf>res.ga,draw=res.gf===res.ga;
  let coins=(win?200:draw?80:40)+res.gf*40+(res.ga===0?50:0);
  const a=f.home?0:f.opp,b=f.home?f.opp:0;
  const rd=simOthers(S.week,f.home?{ga:res.gf,gb:res.ga}:{ga:res.ga,gb:res.gf});
  record(a,b,f.home?res.gf:res.ga,f.home?res.ga:res.gf);
  S.results.push(rd);
  S.history.unshift({opp:tname(f.opp),gf:res.gf,ga:res.ga,season:S.season});
  S.history=S.history.slice(0,40);
  updateStats(res,false);
  mission('play');if(win)mission('win');mission('goal',res.gf);
  S.week++;
  let extra='';
  if(S.week>=10){
    S.seasonDone=true;const rk=ranking().indexOf(0)+1;
    S.rank=[0,1000,500,300,200,150,100][rk];coins+=S.rank;if(rk===1)S.champs++;
    extra='<p style="color:var(--accent);font-weight:700">シーズン終了。最終順位 '+rk+' 位(ボーナス '+S.rank+' C)</p>';
  }
  S.coins+=coins;save();showResult(res,coins,extra);
}

async function onlineInit(){
  try{
    if(typeof claude==='undefined'||!claude.use)return;
    ON.user=await claude.use('user');ON.db=await claude.use('db');
    if(!ON.db)return;
    ON.uid=ON.user?await ON.user.id():null;
    ON.canWrite=ON.user?await ON.user.can('data.write'):null;
    ON.state='loading';
    const timer=setTimeout(()=>{if(ON.state==='loading'){ON.state='slow';onlineRefresh()}},10000);
    ON.db.collection('teams').onSnapshot(sn=>{clearTimeout(timer);ON.teams=sn.docs.map(d=>Object.assign({},d.data(),{id:d.id}));ON.state='ok';onlineRefresh()},()=>{clearTimeout(timer);ON.state='err';onlineRefresh()});
    ON.db.collection('feed').orderBy('t','desc').limit(20).onSnapshot(sn=>{ON.feed=sn.docs.map(d=>d.data());onlineRefresh()},()=>{});

  const coins=(win?150:draw?60:30)+res.gf*20;
  updateStats(res,true);
  mission('play');if(win)mission('win');mission('goal',res.gf);
  S.history.unshift({opp:t.name||'?',gf:res.gf,ga:res.ga,season:S.season,on:true});S.history=S.history.slice(0,40);
  S.coins+=coins;save();showResult(res,coins,(t.local?'<p class="muted" style="font-size:12px">ワンタップマッチ</p>':'<p class="muted" style="font-size:12px">オンライン戦(ランキングに反映されます)</p>'));
  if(ON.db&&ON.uid&&ON.canWrite!==false&&!t.local){
    try{
      await ON.db.collection('feed').add({a:ON.uid,an:S.club,b:t.id,bn:t.name||'?',ga:res.gf,gb:res.ga,t:Date.now()});
      if(S.published)await publishTeam(true);
    }catch(e){}
  }
}

function fxLoop(){
  const c=$('#gfx'),g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);
  let alive=false;
  for(const p of gx.parts){
    if(p.l<=0)continue;alive=true;p.l-=p.dl;
    if(p.k==='ring'){p.r+=p.vr;g.globalAlpha=Math.max(0,p.l);g.strokeStyle=p.c;g.lineWidth=p.w*p.l+1;g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.stroke();continue}
    p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.992;p.rot+=p.vr;
    g.globalAlpha=Math.max(0,Math.min(1,p.l));g.fillStyle=p.c;
    g.save();g.translate(p.x,p.y);g.rotate(p.rot);g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);g.restore();
  }
  g.globalAlpha=1;
  if(alive)gx.raf=requestAnimationFrame(fxLoop);else{gx.raf=0;g.clearRect(0,0,c.width,c.height)}
}
function fx(kind,col,x,y,n){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const c=$('#gfx');if(c.width!==innerWidth||c.height!==innerHeight){c.width=innerWidth;c.height=innerHeight}
  const cols=[col,'#ffffff','#ffd45a',col];
  if(kind==='ring'){for(let i=0;i<3;i++)gx.parts.push({k:'ring',x,y,r:10,vr:11+i*8,l:1,dl:.018,w:7,c:col})}
  else for(let i=0;i<n;i++){const a=Math.random()*6.283,v=rr(3,16);gx.parts.push({k:'sq',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-rr(2,6),g:.22,l:1,dl:rr(.006,.016),s:rr(6,14),rot:rr(0,6),vr:rr(-.3,.3),c:pick(cols)})}
  gx.parts=gx.parts.filter(p=>p.l>0).slice(-700);
  if(!gx.raf)gx.raf=requestAnimationFrame(fxLoop);
}

function kickScene(cv,lv,D,fake){
  const g=cv.getContext('2d'),CW=960,CH=540;cv.width=CW;cv.height=CH;
  const sc={col:'#cbd5e1',t0:performance.now(),trail:[],hitT:-1,raf:0,stop:false,pos:{x:480,y:455},hit:false,post:false};
  const side=Math.random()<.5?-1:1,tx=480+side*rr(100,138),ty=rr(172,218);
  const GX0=320,GX1=640,GY0=140,GY1=276,px=side>0?GX1-6:GX0+6,py=GY0+4;
  const crowd=Array.from({length:230},()=>({x:rr(0,CW),y:rr(36,122),c:pick(['#e5484d','#3b82f6','#f5f5f5','#ffb020','#22c55e','#9ca3af']),r:rr(2.5,5.5),o:rr(0,6)}));
  const K=.62,HIT=.88,POST=.78;
  const bp=p=>{
    if(p<K)return {x:480,y:455,s:1};
    if(fake){
      if(p<POST){const f=(p-K)/(POST-K);return {x:lerp(480,px,f),y:lerp(455,py,f)-Math.sin(Math.PI*f)*40,s:1-.5*f}}
      const f=Math.min(1,(p-POST)/(HIT-POST));return {x:lerp(px,tx,f),y:lerp(py,ty,f)+Math.sin(Math.PI*f)*-26+f*f*20,s:.5-.06*f}
    }
    const f=Math.min(1,(p-K)/(HIT-K));return {x:lerp(480,tx,f),y:lerp(455,ty,f)-Math.sin(Math.PI*f)*80,s:1-.56*f}
  };
  const fig=(x,y,sc2,jersey,o)=>{
    o=o||{};g.save();g.translate(x,y);g.scale(sc2,sc2);if(o.rot)g.rotate(o.rot);
    g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(0,2,46,10,0,0,7);g.fill();
    g.lineCap='round';
    const sw=o.sw||0,kk=o.kick||0;
    g.strokeStyle=o.sock||jersey;g.lineWidth=15;
    g.beginPath();g.moveTo(-14,-92);g.lineTo(-16+sw*8,-8+sw*10);g.stroke();
    g.beginPath();g.moveTo(14,-92);g.lineTo(16-sw*8+kk*10,-8-sw*10-kk*60);g.stroke();
    g.fillStyle=o.shorts||'#0b2233';g.fillRect(-26,-118,52,40);
    g.fillStyle='#15191d';g.beginPath();g.ellipse(-16+sw*8,-4+sw*10,11,6,0,0,7);g.fill();g.beginPath();g.ellipse(16-sw*8+kk*10,-4-sw*10-kk*60,11,6,0,0,7);g.fill();
    g.fillStyle=jersey;g.beginPath();g.roundRect?g.roundRect(-30,-190,60,76,10):g.rect(-30,-190,60,76);g.fill();
    g.strokeStyle=jersey;g.lineWidth=12;g.beginPath();g.moveTo(-34,-180);g.lineTo(-44-sw*4,-132);g.stroke();g.beginPath();g.moveTo(34,-180);g.lineTo(44+sw*4,-132);g.stroke();
    g.fillStyle=o.skin||'#e0a97d';g.beginPath();g.arc(0,-208,15,0,7);g.fill();
    g.fillStyle='#16110d';g.beginPath();g.arc(0,-212,15.5,Math.PI,0);g.fill();
    if(o.num){g.fillStyle='rgba(255,255,255,.9)';g.font='800 36px "Barlow Condensed",sans-serif';g.textAlign='center';g.fillText(o.num,0,-142)}
    g.restore();
  };
  function frame(now){
    if(sc.stop)return;
    const el=now-sc.t0,p=el/D,col=sc.col;
    const zp=bp(Math.min(p,HIT)),zf=lv>=1?Math.max(0,Math.min(1,(p-.5)/(HIT-.5))):0,zz=1+.28*zf*zf*(lv>=2?1.3:1),zx=480+(zp.x-480)*zf,zy=300+(zp.y-300)*zf;
    g.save();g.translate(zx,zy);g.scale(zz,zz);g.translate(-zx,-zy);
    /* 背景 */
    const sk=g.createLinearGradient(0,0,0,300);sk.addColorStop(0,'#04070d');sk.addColorStop(1,'#14202f');g.fillStyle=sk;g.fillRect(0,0,CW,CH);
    for(const c of crowd){g.globalAlpha=.55+.4*Math.sin(el/260+c.o);g.fillStyle=c.c;g.beginPath();g.arc(c.x,c.y+Math.sin(el/180+c.o)*1.5,c.r,0,7);g.fill()}

    /* ピッチ */

    for(let i=0;i<ys.length-1;i++){g.fillStyle=i%2?'#1f6b3a':'#2a7d45';g.fillRect(0,ys[i],CW,ys[i+1]-ys[i]+1)}
    g.strokeStyle='rgba(255,255,255,.75)';g.lineWidth=3;
    g.beginPath();g.moveTo(240,283);g.lineTo(130,540);g.moveTo(720,283);g.lineTo(830,540);g.moveTo(240,283);g.lineTo(720,283);g.stroke();

    for(let x=GX0;x<=GX1;x+=16){g.beginPath();for(let y=GY0;y<=GY1;y+=12){const o=wob(x,y);y===GY0?g.moveTo(x+o,y):g.lineTo(x+o,y)}g.stroke()}

    for(let i=0;i<sc.trail.length;i++){const t=sc.trail[i],a=i/sc.trail.length;g.globalAlpha=a*.55;g.fillStyle=col;g.beginPath();g.arc(t.x,t.y,t.r*(.35+.65*a),0,7);g.fill()}

    const gl=g.createRadialGradient(bx,by,br*.5,bx,by,br+aur);gl.addColorStop(0,col+'cc');gl.addColorStop(1,col+'00');g.fillStyle=gl;g.beginPath();g.arc(bx,by,br+aur,0,7);g.fill();
    g.fillStyle='#f6f6f3';g.beginPath();g.arc(bx,by,br,0,7);g.fill();g.strokeStyle='#222';g.lineWidth=Math.max(1,br*.08);g.stroke();
    g.fillStyle='#1b1b1b';const ra=el/140;for(let k=0;k<3;k++){const a=ra+k*2.09;g.beginPath();g.arc(bx+Math.cos(a)*br*.5,by+Math.sin(a)*br*.5,br*.22,0,7);g.fill()}
    /* キッカー(後ろ姿) */
    const runP=Math.min(1,p/.55),sx=lerp(150,392,runP),sw=p<.55?Math.sin(el/75)*(1-runP*.2):0;
    let kk=0;if(p>=.55&&p<K)kk=-.6*((p-.55)/(K-.55));else if(p>=K)kk=-.6+Math.min(1,(p-K)/.06)*1.9-Math.max(0,(p-K-.06)/.12);
    fig(sx,528,1.05,S.color||'#3ec1ff',{num:'10',sw,kick:Math.max(-.6,Math.min(1.3,kk))*(p<.55?0:1)});
    /* 命中 */
    if(p>=HIT&&!sc.hit){sc.hit=true;sc.hitT=el;onHit(bx,by)}
    if(fake&&p>=POST&&!sc.post){sc.post=true;sfx('impact');flash()}
    g.restore();
    if(lv>=1&&p<K){const v=.3+.22*Math.sin(el/(260-120*p)),vg=g.createRadialGradient(480,270,150,480,270,560);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,'+v+')');g.fillStyle=vg;g.fillRect(0,0,CW,CH)}
    if(lv>=2&&hitAge>=0&&hitAge<700){const bx2=zx+(sc.pos.x-zx)*zz,by2=zy+(sc.pos.y-zy)*zz;g.strokeStyle=col;g.globalAlpha=1-hitAge/700;g.lineWidth=5;for(let i=0;i<24;i++){const a=i/24*6.283,r1=hitAge*.9,r2=r1+90;g.beginPath();g.moveTo(bx2+Math.cos(a)*r1,by2+Math.sin(a)*r1);g.lineTo(bx2+Math.cos(a)*r2,by2+Math.sin(a)*r2);g.stroke()}g.globalAlpha=1}
    if(lv>=2){const bh=Math.min(1,p*3)*34;g.fillStyle='#000';g.fillRect(0,0,CW,bh);g.fillRect(0,CH-bh,CW,bh)}
    g.fillStyle='rgba(0,0,0,'+Math.max(0,.55-p*1.2)+')';g.fillRect(0,0,CW,CH);
    sc.raf=requestAnimationFrame(frame);
  }
  const onHit=(bx,by)=>{
    const r=cv.getBoundingClientRect(),X=r.left+bx/CW*r.width,Y=r.top+by/CH*r.height;
    fx('ring',sc.col,X,Y);if(lv>=2)fx('conf',sc.col,X,Y,60);
    sfx('impact');flash();if(lv>=2)shake(500);
  };
  sc.raf=requestAnimationFrame(frame);
  return sc;
}
function gachaRun(n,mode){
  audioUnlock();
  const res=doPull(n,mode);if(!res){toast('コインまたはチケットが足りません');return}
  gx.res=res;gx.last={n,mode};clearTimers();gx.parts=[];
  const best=bestOf(res),lv=RO.indexOf(best),D=[1500,1900,2700,3600][lv];
  const o=$('#gx');o.hidden=false;o.className='gx';
  $('#gbody').innerHTML='<div class="kwrap" id="ow"><canvas id="kc" class="kc"></canvas></div><div class="gtext" id="gt">SCOUTING…</div><button class="btn sm" data-act="gskip">スキップ</button>';
  render();
  const setOrb=c=>{const w=$('#ow');if(w)w.style.setProperty('--oc',c);if(gx.scene)gx.scene.col=c};
  const txt=t=>{const e=$('#gt');if(e)e.textContent=t};
  const fake=lv<2&&Math.random()<.45;
  if(gx.scene){gx.scene.stop=true;cancelAnimationFrame(gx.scene.raf)}
  gx.scene=$('#kc')&&$('#kc').getContext?kickScene($('#kc'),lv,D,fake):null;
  setOrb('#cbd5e1');sfx('rise');sfx('crowd');if(lv>=1)later(()=>sfx('crowd'),D*.5);
  const steps=[];
  if(lv>=1)steps.push(['#60a5fa',.34]);if(lv>=2)steps.push(['#c084fc',.58]);if(lv>=3)steps.push(['#ffb020',.82]);
  steps.forEach(([c,f])=>later(()=>{setOrb(c);sfx('impact');flash();vib(30);if(c==='#c084fc')o.classList.add('sr');if(c==='#ffb020'){o.classList.remove('sr');o.classList.add('ur')}},D*f));
  if(fake){later(()=>{setOrb('#c084fc');txt('…!?');sfx('impact');flash()},D*.55);later(()=>{setOrb('#cbd5e1');txt('SCOUTING…')},D*.8)}
  later(()=>txt('GET READY'),D*.45);
  if(lv>=2)later(()=>{txt('…!?');const e=$('#orb');if(e)e.classList.add('shake2')},D*.6);
  if(lv>=3)later(()=>{txt('来る…!!');shake(900);vib([60,40,60,40,120])},D*.82);
  let tt=0;const roll=()=>{const p=tt/D;if(p>=1)return;sfx('tick',p*14);const w=Math.max(70,260*(1-p)+60);tt+=w;later(roll,w)};roll();
  later(()=>{const p=orbPos();fx('ring','#fff',p.x,p.y);sfx('impact');if(lv>=1)sfx('cheer');flash();gachaReveal(best,false)},D);
}
function gachaSkip(){clearTimers();if(gx.res)gachaReveal(bestOf(gx.res),true)}
function cardHtml(r,i){
  const p=r.p,c=RAR[p.rar].c;
  return '<div class="card '+p.rar+'" id="cd'+i+'" style="--c0:'+c+';--c1:'+c+'33"><div class="in"><div class="b">?</div><div class="f"><span class="rar '+p.rar+'">'+p.rar+'</span><div class="o" style="color:'+c+'">'+ovr(p)+'</div><span class="tag '+p.pos+'">'+p.pos+'</span><div class="n">'+esc(p.name)+'</div>'+(p.sk?'<span class="sk">'+SK[p.sk]+'</span>':'')+(p.pick?'<span class="newtag" style="background:var(--accent);color:var(--accent-ink)">PICK UP</span>':'')+'<small>'+(p.nat?p.nat+' / ':'')+p.age+'歳 / '+p.ht+'cm</small>'+(r.sold?'<small>売却 +'+r.sold+' C</small>':'<span class="newtag">NEW</span>')+'</div></div></div>';
}
function showSummary(){
  const res=gx.res;if(!res||$('#gx').hidden)return;
  const cnt={UR:0,SR:0,R:0,N:0};res.forEach(r=>cnt[r.p.rar]++);
  const l=gx.last||{n:res.length,mode:'coin'},mode=l.mode==='free'?'coin':l.mode;
  const afford=mode==='ticket'?S.tickets>=l.n:S.coins>=(l.n===10?PRICE10:PRICE1);
  const el=$('#gsum');if(!el)return;
  el.innerHTML='<div class="gsum"><div class="gcount">'+['UR','SR','R','N'].map(k=>'<span><i class="rar '+k+'">'+k+'</i>×'+cnt[k]+'</span>').join('')+'</div><div class="muted" style="font-size:12px">URまで あと '+Math.max(0,40-S.pity)+' 回 ・ '+(mode==='ticket'?'チケット '+S.tickets+' 枚':S.coins.toLocaleString()+' C')+'</div><div class="pity" style="max-width:320px;margin:6px auto"><i style="width:'+Math.min(100,S.pity/40*100)+'%"></i></div><div class="row" style="justify-content:center;margin-top:12px"><button class="btn pri" data-act="gagain"'+(afford?'':' disabled')+'>'+(l.n===10?'もう10連':'もう1回')+'</button><button class="btn" data-act="gclose">閉じる</button></div></div>';
}
function gachaReveal(best,skip){
  const res=gx.res;if(!res)return;
  clearTimers();if(gx.scene){gx.scene.stop=true;cancelAnimationFrame(gx.scene.raf);gx.scene=null}
  const lv=RO.indexOf(best),o=$('#gx'),one=res.length===1;
  o.classList.remove('sr','ur');if(best==='UR')o.classList.add('ur');else if(best==='SR')o.classList.add('sr');
  const showCards=sk=>{
    $('#gbody').innerHTML='<div class="cards'+(one?' one':'')+'">'+res.map(cardHtml).join('')+'</div><div id="gsum"></div>';
    const order=res.map((r,i)=>i).sort((a,b)=>RO.indexOf(res[a].p.rar)-RO.indexOf(res[b].p.rar)||a-b);
    let t=one?250:350;
    order.forEach((i,k)=>{
      const r=res[i],rl=RO.indexOf(r.p.rar);
      if(!sk&&!one&&k===order.length-1&&rl>=2)t+=700;
      const at=t;t+=rl>=2?460:240;
      const go=()=>{
        const e=$('#cd'+i);if(!e)return;e.classList.add('up');
        if(sk)return;
        if(rl>=1)sfx(r.p.rar);
        if(rl>=2){
          const b=e.getBoundingClientRect(),cx=b.left+b.width/2,cy=b.top+b.height/2,col=RAR[r.p.rar].c;
          fx('ring',col,cx,cy);fx('conf',col,cx,cy,rl===3?170:80);flash();vib(rl===3?[80,40,80,40,160]:[50]);
          if(rl===3)shake(600);
        }
      };
      if(sk)go();else later(go,at);
    });
    if(sk)showSummary();else later(showSummary,t+400);
  };
  if(skip||lv<2){showCards(!!skip);return}
  {const bp2=(res.find(r=>r.p.rar===best)||res[0]).p;$('#gbody').innerHTML='<div class="cutin '+best+'"><div class="cband"></div><div class="splash '+best+'">'+(best==='UR'?'ULTRA RARE':'SUPER RARE')+'</div><div class="cname">'+esc(bp2.name)+' <b>'+ovr(bp2)+'</b></div></div>'}
  const p={x:innerWidth/2,y:innerHeight*.42};
  fx('ring',RAR[best].c,p.x,p.y);fx('conf',RAR[best].c,p.x,p.y,best==='UR'?220:110);
  sfx(best);vib(best==='UR'?[100,50,100,50,200]:[60]);shake(600);
  if(best==='UR')[300,700,1100,1500].forEach(ms=>later(()=>{fx('conf','#ffd45a',innerWidth*rr(.2,.8),innerHeight*.35,90);fx('ring','#ffd45a',innerWidth/2,innerHeight*.42);shake(300)},ms));
  later(()=>showCards(false),best==='UR'?2300:1300);
}
function gachaClose(){$('#gx').hidden=true;clearTimers();if(gx.scene){gx.scene.stop=true;cancelAnimationFrame(gx.scene.raf);gx.scene=null}cancelAnimationFrame(gx.raf);gx.raf=0;gx.parts=[];gx.res=null;render()}
(function boot(){
  const L=$('#load'),bar=$('#loadbar'),pc=$('#lpct'),tp=$('#ltip'),bt=$('#lstart');
  const TIPS=['パスは緑の輪の味方に届きます','シュートは長押しでパワーをため、照準線を見て狙おう','FEINTで相手を置き去りにしよう','DASHは体力を使います。使いどころが大事','ガチャは40連でURが確定します','デイリーミッションを毎日こなそう'];
  let t=0,ti=0;tp.textContent='TIPS　'+TIPS[0];
  const tv=setInterval(()=>{ti=(ti+1)%TIPS.length;tp.textContent='TIPS　'+TIPS[ti]},1800);
  const iv=setInterval(()=>{t+=.04;const v=Math.min(100,t*100/2.6);bar.style.width=v+'%';pc.textContent=Math.floor(v)+'%';
    if(t>=2.6&&(typeof THREE!=='undefined'||t>5)){clearInterval(iv);clearInterval(tv);pc.textContent='READY';bt.hidden=false}},40);
  bt.addEventListener('click',()=>{audioUnlock();sfx('whistle');L.classList.add('out');setTimeout(()=>{L.hidden=true},550)});
  $('#intro').addEventListener('click',()=>{if(M)M.skip=true});$('#rpl').addEventListener('click',()=>{if(M)M.skip=true});
})();
S=load();if(S&&S.opt&&!S.opt.zoom)S.opt.zoom=1;applyEdit();
render();
onlineInit();
